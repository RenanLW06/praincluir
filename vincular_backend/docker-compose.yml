# Sobe apenas o PostgreSQL para desenvolvimento.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: vincular
      POSTGRES_USER: vincular
      POSTGRES_PASSWORD: vincular
    ports:
      - "15432:5432"
    volumes:
      - vincular_pgdata:/var/lib/postgresql/data

volumes:
  vincular_pgdata:
